      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          PRODUCTS_TABLE: !Ref ProductsTableName
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();
          const PRODUCTS_TABLE = process.env.PRODUCTS_TABLE;
          exports.handler = async (event) => {
            const headers = {
              'Access-Control-Allow-Origin': '*',
              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
              'Access-Control-Allow-Methods': 'POST,OPTIONS'
            };
            if (event.httpMethod === 'OPTIONS') {
              return { statusCode: 200, headers, body: '' };
            }
            try {
              const body = JSON.parse(event.body);
              const { weddingIds } = body;
              if (!Array.isArray(weddingIds)) {
                return { statusCode: 400, headers, body: JSON.stringify({ error: 'weddingIds must be an array' }) };
              }
              const scanResult = await dynamodb.scan({ TableName: PRODUCTS_TABLE }).promise();
              const products = scanResult.Items;
              const updatePromises = [];
              for (const product of products) {
                const isWeddingTales = weddingIds.includes(product.id);
                if (product.isWeddingTales !== isWeddingTales) {
                  updatePromises.push(dynamodb.update({
                    TableName: PRODUCTS_TABLE,
                    Key: { id: product.id, PK: `PRODUCT#${product.id}` },
                    UpdateExpression: 'SET isWeddingTales = :val, updatedAt = :updatedAt',
                    ExpressionAttributeValues: { ':val': isWeddingTales, ':updatedAt': new Date().toISOString() }
                  }).promise());
                }
              }
              await Promise.all(updatePromises);
              return { statusCode: 200, headers, body: JSON.stringify({ message: 'Wedding Tales updated', updated: updatePromises.length }) };
            } catch (error) {
              return { statusCode: 500, headers, body: JSON.stringify({ error: error.message }) };
            }
          };

  # Batch Designers Discount Lambda
  BatchDesignersFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub fashionstore-${Environment}-batch-designers
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          PRODUCTS_TABLE: !Ref ProductsTableName
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();
          const PRODUCTS_TABLE = process.env.PRODUCTS_TABLE;
          exports.handler = async (event) => {
            const headers = {
              'Access-Control-Allow-Origin': '*',
              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
              'Access-Control-Allow-Methods': 'POST,OPTIONS'
            };
            if (event.httpMethod === 'OPTIONS') {
              return { statusCode: 200, headers, body: '' };
            }
            try {
              const body = JSON.parse(event.body);
              const { designersDiscount } = body;
