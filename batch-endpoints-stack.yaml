AWSTemplateFormatVersion: '2010-09-09'
Description: Batch endpoints for Featured, Wedding Tales, and Designers Discount

Parameters:
  RestApiId:
    Type: String
    Description: Existing API Gateway REST API ID
    Default: l7u50xa9j4

  ProductsTableName:
    Type: String
    Default: fashionstore-products-prod

  Environment:
    Type: String
    Default: prod

Resources:
  # Batch Featured Lambda
  BatchFeaturedFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub fashionstore-${Environment}-batch-featured
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          PRODUCTS_TABLE: !Ref ProductsTableName
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();
          const PRODUCTS_TABLE = process.env.PRODUCTS_TABLE;
          exports.handler = async (event) => {
            const headers = {
              'Access-Control-Allow-Origin': '*',
              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
              'Access-Control-Allow-Methods': 'POST,OPTIONS'
            };
            if (event.httpMethod === 'OPTIONS') {
              return { statusCode: 200, headers, body: '' };
            }
            try {
              const body = JSON.parse(event.body);
              const { featuredIds } = body;
              if (!Array.isArray(featuredIds)) {
                return { statusCode: 400, headers, body: JSON.stringify({ error: 'featuredIds must be an array' }) };
              }
              const scanResult = await dynamodb.scan({ TableName: PRODUCTS_TABLE }).promise();
              const products = scanResult.Items;
              const updatePromises = [];
              for (const product of products) {
                const isFeatured = featuredIds.includes(product.id);
                if (product.isFeatured !== isFeatured) {
                  updatePromises.push(dynamodb.update({
                    TableName: PRODUCTS_TABLE,
                    Key: { id: product.id, PK: `PRODUCT#${product.id}` },
                    UpdateExpression: 'SET isFeatured = :isFeatured, updatedAt = :updatedAt',
                    ExpressionAttributeValues: { ':isFeatured': isFeatured, ':updatedAt': new Date().toISOString() }
                  }).promise());
                }
              }
              await Promise.all(updatePromises);
              return { statusCode: 200, headers, body: JSON.stringify({ message: 'Featured products updated', updated: updatePromises.length }) };
            } catch (error) {
              return { statusCode: 500, headers, body: JSON.stringify({ error: error.message }) };
            }
          };

